name: release-verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_AI_ENABLED: "false"
      MODEL_EXPLANATION_AI_ENABLED: "false"
      SUPPORT_SIGNAL_AI_ENABLED: "false"
      RAZORPAY_INTEGRATION_ENABLED: "false"
      RAZORPAY_TEST_MODE: "true"
      RAZORPAY_WEBHOOK_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild complete deterministic artifacts
        run: python -m src.pipeline

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run complete release gate
        shell: pwsh
        run: ./scripts/verify_release.ps1
